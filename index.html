<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雪梨・坎培拉 景點</title>
  <meta name="description" content="雪梨與坎培拉推薦景點、交通資訊與行程地圖">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦘</text></svg>">
  <link rel="stylesheet" href="vendor/huninn/huninn.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section class="hero">
    <svg class="cloud c1" viewBox="0 0 120 50" aria-hidden="true"><path d="M20 45h80a18 18 0 0 0 0-36 26 26 0 0 0-48-2A20 20 0 0 0 20 45z" fill="#fff"/></svg>
    <svg class="cloud c2" viewBox="0 0 120 50" aria-hidden="true"><path d="M20 45h80a18 18 0 0 0 0-36 26 26 0 0 0-48-2A20 20 0 0 0 20 45z" fill="#fff"/></svg>
    <div class="container hero-inner">
      <span class="hello">👋 G'day！我們的澳洲小旅行</span>
      <h1><span class="hl2">雪梨</span>・<span class="hl">坎培拉</span> 景點指南</h1>
      <p>20 個必去景點 ✦ 交通攻略 ✦ 附近景點，一次看懂</p>
      <a class="btn btn-coral" href="map.html">🗺️ 打開景點地圖</a>
    </div>
    <svg class="hero-art" viewBox="0 0 1100 200" aria-hidden="true">
      <!-- 太陽 -->
      <circle cx="930" cy="70" r="38" fill="#FFD166"/>
      <circle cx="930" cy="70" r="52" fill="#FFD166" opacity=".25"/>
      <!-- 港灣大橋 -->
      <g fill="none" stroke="#8FA9C4" stroke-width="7" stroke-linecap="round">
        <path d="M120 170 Q 270 40 420 170"/>
        <path d="M60 150 H 480"/>
      </g>
      <g stroke="#8FA9C4" stroke-width="3">
        <line x1="180" y1="108" x2="180" y2="150"/><line x1="230" y1="84" x2="230" y2="150"/>
        <line x1="270" y1="78" x2="270" y2="150"/><line x1="310" y1="84" x2="310" y2="150"/><line x1="360" y1="108" x2="360" y2="150"/>
      </g>
      <rect x="92" y="122" width="26" height="48" rx="4" fill="#B9C9DA"/>
      <rect x="422" y="122" width="26" height="48" rx="4" fill="#B9C9DA"/>
      <!-- 歌劇院 -->
      <rect x="560" y="160" width="250" height="18" rx="6" fill="#F3DCC4"/>
      <path d="M580 162 Q 600 80 660 70 Q 640 120 650 162 Z" fill="#fff" stroke="#E7D8C6" stroke-width="3"/>
      <path d="M630 162 Q 660 60 730 50 Q 700 110 712 162 Z" fill="#fff" stroke="#E7D8C6" stroke-width="3"/>
      <path d="M700 162 Q 730 90 790 86 Q 770 128 780 162 Z" fill="#fff" stroke="#E7D8C6" stroke-width="3"/>
      <!-- 袋鼠 -->
      <g transform="translate(900 120)" fill="#E9A06B">
        <ellipse cx="20" cy="40" rx="22" ry="26"/>
        <circle cx="38" cy="10" r="13"/>
        <ellipse cx="32" cy="-6" rx="4" ry="10" transform="rotate(-15 32 -6)"/>
        <ellipse cx="42" cy="-6" rx="4" ry="10" transform="rotate(15 42 -6)"/>
        <path d="M0 50 Q -40 60 -50 40 Q -30 52 0 40 Z"/>
        <ellipse cx="28" cy="66" rx="16" ry="5"/>
        <circle cx="42" cy="9" r="2.2" fill="#3D3553"/>
        <circle cx="50" cy="13" r="2" fill="#3D3553"/>
        <circle cx="38" cy="16" r="3" fill="#FF9EC1" opacity=".7"/>
      </g>
      <!-- 小船 -->
      <g transform="translate(500 170)"><path d="M0 10 H 46 L 38 22 H 8 Z" fill="#FF8C6B"/><path d="M22 10 V -18 L 40 8 Z" fill="#fff"/></g>
    </svg>
    <svg class="sea" viewBox="0 0 1200 56" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 14 Q 30 0 60 14 T 120 14 T 180 14 T 240 14 T 300 14 T 360 14 T 420 14 T 480 14 T 540 14 T 600 14 T 660 14 T 720 14 T 780 14 T 840 14 T 900 14 T 960 14 T 1020 14 T 1080 14 T 1140 14 T 1200 14 V 56 H 0 Z" fill="#9AD3F0"/>
      <path d="M0 32 Q 30 21 60 32 T 120 32 T 180 32 T 240 32 T 300 32 T 360 32 T 420 32 T 480 32 T 540 32 T 600 32 T 660 32 T 720 32 T 780 32 T 840 32 T 900 32 T 960 32 T 1020 32 T 1080 32 T 1140 32 T 1200 32 V 56 H 0 Z" fill="#6FBDE6"/>
    </svg>
    <svg class="wave" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0 H1200 V12 Q 900 40 600 18 T 0 22 Z" fill="#6FBDE6"/></svg>
  </section>

  <main class="container">
    <div class="filters">
      <div class="filter-row">
        <div class="chips" id="cityChips"></div>
        <input type="search" id="search" class="search" placeholder="🔍 搜尋景點…">
      </div>
      <div class="filter-row">
        <div class="chips small" id="catChips"></div>
        <div class="chips small" id="statusChips"></div>
      </div>
      <p class="count" id="count"></p>
    </div>

    <div id="grid"></div>

    <section class="info-box">
      <h2>🚌 雪梨 ↔ 坎培拉 怎麼去？</h2>
      <ul class="transport-list" id="intercity"></ul>
      <p class="muted">雪梨市區的火車、公車、渡輪、輕軌都可以用 Opal 卡或信用卡感應付款；坎培拉的公車和輕軌可以用 MyWay+ 或信用卡感應付款。</p>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/credits.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cards.js"></script>
</body>
</html>
